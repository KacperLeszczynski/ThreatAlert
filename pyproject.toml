[project]
name = "threat-alerting"
version = "0.1.0"
description = "Auditable cyber-news threat alerting workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "feedparser>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "langgraph>=0.6,<2.0",
    "openai>=1.100,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_alerting"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
